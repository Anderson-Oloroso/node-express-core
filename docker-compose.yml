services:
  # 🟢 SERVICIO 1: API de Express en Node.js
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: express_core_api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mysql
    networks:
      - backend-network
    # Modo interactivo en espera para compatibilidad con entorno Campuslands y ejecucion modular (Fixes #3)
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  # 🐬 SERVICIO 2: Base de Datos Relacional MySQL Oficial
  mysql:
    image: mysql:8.0
    container_name: mysql_core
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-express_core_db}
      MYSQL_USER: ${DB_USER:-express_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-express_pass123}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network

# 💾 Persistencia de datos de MySQL
volumes:
  mysql_data:
    driver: local

# 🌐 Red interna privada para comunicación entre API y MySQL
networks:
  backend-network:
    driver: bridge