info:
  name: Get students with role
  type: http
  seq: 1

http:
  method: GET
  url: http://0.0.0.0:3000/student/E001
  headers:
    - name: role
      value: admin
      description: Administrador
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
